schema_version: "1.1"
name: failure-self-edit
expected_outcome: |
  The run is approved up front. dev-deploy runs the gate and the ready command, then the plan check finds that the build step tags shop-api:1.0.0 while deploy/k8s/shop-api.yaml deploys shop-api:latest. That is a rule problem caught before anything runs, so it takes the Self-edit route: it quotes the manifest line, proposes the diff to the built tag as a deploy-file change, writes a deploy-log Self-edits row with status proposed through deploy.py self-edit, and asks for a yes, because the run's approval does not cover changing a deploy file. No docker build, apply, or rollout runs, and the manifest and target entry are unchanged.
context:
  scaffold_script: place-files.sh
